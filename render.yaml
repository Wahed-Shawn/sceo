services:
  - type: web
    name: gridwise
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GRIDWISE_MODELS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-2.5-flash-lite
      - key: GRIDWISE_LLM_TIMEOUT
        value: "5"